<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fairfax Cross County Trail — Transit Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0}body{font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.panel{position:absolute;z-index:1000;background:#fff;box-shadow:0 2px 12px #0003;border-radius:8px}
.title{top:12px;left:12px;padding:10px 14px;max-width:380px}.title h1{font-size:17px;margin:0 0 3px}.title p{font-size:12px;margin:0;color:#555}
.legend{bottom:18px;left:12px;padding:10px 12px;max-width:340px;max-height:55vh;overflow:auto;font-size:12px}.controls{top:12px;right:12px;padding:8px;display:flex;gap:6px}
button{border:1px solid #bbb;background:#fff;border-radius:5px;padding:7px 10px;cursor:pointer}button:hover{background:#f5f5f5}
.legend-row{display:flex;align-items:center;gap:7px;margin:5px 0}.legend-row label{cursor:pointer;display:flex;align-items:center;gap:7px}.legend-row input{margin:0}
.swatch{width:20px;height:20px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:10px;flex:none}.bus{border-radius:50%}.metro{transform:rotate(45deg);border-radius:2px}.metro span{transform:rotate(-45deg)}
.popup h3{margin:0 0 5px;font-size:15px}.popup p{margin:3px 0}.popup a{color:#1769aa}.status{color:#666;font-size:11px;margin-top:7px}.user-dot{width:16px;height:16px;border-radius:50%;background:#1464d2;border:3px solid white;box-shadow:0 0 0 2px #1464d2}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel title"><h1>Fairfax Cross County Trail</h1><p>Transit & parking map</p><div id="status" class="status">Loading map layers…</div></div>
<div class="panel controls"><button id="locate">⌖ Locate Me</button></div>
<div class="panel legend"><b>Map layers</b><div id="legend-content">Loading…</div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="cct_map_theme.js"></script>
<script>
const T=window.CCT_MAP_THEME;
const BASE='https://raw.githubusercontent.com/squiddy-gh/cross-county-trail/main/';
const URLS={gpx:BASE+'data/trail/GC_CCT.gpx',pois:BASE+'data/curated_pois_enriched.csv',transit:BASE+'data/transit.csv'};
const map=L.map('map').setView([38.82,-77.25],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
const layers={trail:L.layerGroup().addTo(map),parking:L.layerGroup().addTo(map),bus:L.layerGroup().addTo(map),metro:L.layerGroup().addTo(map),otherTransit:L.layerGroup().addTo(map)};
const loaded={trail:false,parking:false,bus:false,metro:false};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function parseCSV(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&q&&n==='"'){cell+='"';i++;continue}if(c==='"'){q=!q;continue}if(c===','&&!q){row.push(cell);cell='';continue}if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);cell='';if(row.some(v=>v!==''))rows.push(row);row=[];continue}cell+=c}if(cell!==''||row.length){row.push(cell);rows.push(row)}const h=rows.shift()||[];return rows.map(r=>Object.fromEntries(h.map((x,i)=>[x.trim(),(r[i]??'').trim()])))}
async function get(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(`${r.status} ${r.statusText}: ${url}`);return r.text()}
function routeColor(r){return T.transit.routes[r]||T.transit.busDefault}
function busIcon(routes){const rs=(routes||'').split(',').map(x=>x.trim()).filter(Boolean);const label=rs.length>2?rs.slice(0,2).join('/')+'+':rs.join('/');const color=routeColor(rs[0]||'');return L.divIcon({className:'',html:`<div class="swatch bus" title="Routes ${esc(rs.join(', '))}" style="background:${color}">${esc(label||'BUS')}</div>`,iconSize:[30,30],iconAnchor:[15,15]})}
function metroIcon(lines){const line=(lines||'').split(',').map(x=>x.trim()).find(x=>T.transit.metro[x])||(lines||'').split(',')[0].trim();const color=T.transit.metro[line]||'#555';return L.divIcon({className:'',html:`<div class="swatch metro" style="background:${color}"><span>M</span></div>`,iconSize:[30,30],iconAnchor:[15,15]})}
function parkingIcon(cap){const small=Number(cap)>0&&Number(cap)<=20;return L.divIcon({className:'',html:`<div class="swatch" style="background:${small?T.parking.small:T.parking.large};border-radius:5px">P</div>`,iconSize:[28,22],iconAnchor:[14,11]})}
function arrivalsURL(t){const route=(t.Routes||'').split(',')[0].trim();const stop=t.stop_code||t.stop_id||'';return `https://www.fairfaxcounty.gov/bustime/wireless/html/eta.jsp?route=${encodeURIComponent(route)}&direction=---&displaydirection=---&stop=${encodeURIComponent(stop)}&findstop=on&selectedRtpiFeeds=&id=${encodeURIComponent(stop)}`}
function popupBus(t){return `<div class="popup"><h3>${esc(t.stop_name||'Fairfax Connector stop')}</h3><p><b>Agency:</b> Fairfax Connector</p><p><b>Stop ID:</b> ${esc(t.stop_id||'')}</p>${t.stop_code?`<p><b>Stop code:</b> ${esc(t.stop_code)}</p>`:''}<p><b>Routes:</b> ${esc(t.Routes||'')}</p>${t.TrailMileage?`<p><b>CCT mile:</b> ${esc(t.TrailMileage)}</p>`:''}<p><a target="_blank" rel="noopener" href="${arrivalsURL(t)}">Live arrivals</a></p></div>`}
function popupTransit(t){return `<div class="popup"><h3>${esc(t.stop_name||t.Name||'Transit station')}</h3><p><b>Agency:</b> ${esc(t.Agency||'')}</p>${t.stop_id?`<p><b>Station/Stop ID:</b> ${esc(t.stop_id)}</p>`:''}${t.Routes?`<p><b>Lines/Routes:</b> ${esc(t.Routes)}</p>`:''}${t.TrailMileage?`<p><b>CCT mile:</b> ${esc(t.TrailMileage)}</p>`:''}${t.URL?`<p><a target="_blank" rel="noopener" href="${esc(t.URL)}">Station information</a></p>`:''}</div>`}
function popupParking(p){return `<div class="popup"><h3>${esc(p.Name||'Parking')}</h3><p><b>Spaces:</b> ${esc(p.Capacity||'')}</p>${p.Surface?`<p><b>Surface:</b> ${esc(p.Surface)}</p>`:''}${p.Hours?`<p><b>Hours:</b> ${esc(p.Hours)}</p>`:''}${p.Fees?`<p><b>Fees:</b> ${esc(p.Fees)}</p>`:''}${p.Notes?`<p>${esc(p.Notes)}</p>`:''}${p.URL?`<p><a target="_blank" rel="noopener" href="${esc(p.URL)}">More information</a></p>`:''}</div>`}
function addLegend(routes){const el=document.getElementById('legend-content');let h='';const item=(id,label,group,checked=true)=>`<div class="legend-row"><label><input type="checkbox" data-layer="${id}" data-group="${group}" ${checked?'checked':''}>${label}</label></div>`;h+=item('trail','<span class="swatch" style="background:#222">━</span> CCT','trail');h+=item('parking','<span class="swatch" style="background:'+T.parking.small+'">P</span> Small parking (≤20)','parking');h+=item('parking','<span class="swatch" style="background:'+T.parking.large+'">P</span> Large parking','parking');[...routes].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).forEach(r=>h+=item('bus','<span class="swatch bus" style="background:'+routeColor(r)+'">'+esc(r)+'</span> Fairfax Connector '+esc(r),'bus'));h+=item('metro','<span class="swatch metro" style="background:'+T.transit.metro.Blue+'"><span>M</span></span> WMATA Metro','metro');h+='<hr><div><a target="_blank" href="https://www.wmata.com/schedules/trip-planner/">WMATA Trip Planner</a></div><div><a target="_blank" href="https://www.fairfaxcounty.gov/connector/">Fairfax Connector</a></div><div><a target="_blank" href="https://www.vre.org/">Virginia Railway Express</a></div>';el.innerHTML=h;el.querySelectorAll('input[data-layer]').forEach(cb=>cb.addEventListener('change',()=>{const group=cb.dataset.group;const l=layers[group];if(!l)return;cb.checked?l.addTo(map):map.removeLayer(l)}))}
async function loadTrail(){try{const text=await get(URLS.gpx);const xml=new DOMParser().parseFromString(text,'application/xml');const pts=[...xml.querySelectorAll('trkpt')].map(x=>[+x.getAttribute('lat'),+x.getAttribute('lon')]).filter(x=>Number.isFinite(x[0])&&Number.isFinite(x[1]));if(!pts.length)throw new Error('No GPX track points found');const line=L.polyline(pts,T.trail).addTo(layers.trail);map.fitBounds(line.getBounds(),{padding:[25,25]});loaded.trail=true}catch(e){console.error('Trail:',e)}}
async function loadParking(){try{const rows=parseCSV(await get(URLS.pois));rows.filter(p=>p.Type&&p.Type.toLowerCase()==='parking'&&p.Latitude&&p.Longitude).forEach(p=>L.marker([+p.Latitude,+p.Longitude],{icon:parkingIcon(p.Capacity)}).bindPopup(popupParking(p)).addTo(layers.parking));loaded.parking=true}catch(e){console.error('Parking:',e)}}
async function loadTransit(){try{const rows=parseCSV(await get(URLS.transit));const routes=new Set();rows.filter(t=>t.Latitude&&t.Longitude).forEach(t=>{const agency=(t.Agency||'').toLowerCase();const type=(t.TransitID||'').toLowerCase();const isBus=type==='bus'||agency.includes('fairfax connector');const isMetro=type==='metro'||agency.includes('wmata')||agency.includes('metro');if(isBus){(t.Routes||'').split(',').map(x=>x.trim()).filter(Boolean).forEach(r=>routes.add(r));L.marker([+t.Latitude,+t.Longitude],{icon:busIcon(t.Routes)}).bindPopup(popupBus(t)).addTo(layers.bus)}else if(isMetro){L.marker([+t.Latitude,+t.Longitude],{icon:metroIcon(t.Routes)}).bindPopup(popupTransit(t)).addTo(layers.metro)}else L.marker([+t.Latitude,+t.Longitude]).bindPopup(popupTransit(t)).addTo(layers.otherTransit)});loaded.bus=true;loaded.metro=true;addLegend(routes)}catch(e){console.error('Transit:',e);addLegend(new Set())}}
async function start(){await Promise.allSettled([loadTrail(),loadParking(),loadTransit()]);document.getElementById('status').textContent=`Layers: ${loaded.trail?'trail ✓':'trail unavailable'} · ${loaded.parking?'parking ✓':'parking unavailable'} · ${loaded.bus?'transit ✓':'transit unavailable'}`}
document.getElementById('locate').onclick=()=>{if(!navigator.geolocation)return alert('Geolocation is not available in this browser.');navigator.geolocation.getCurrentPosition(p=>{const ll=L.latLng(p.coords.latitude,p.coords.longitude);L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="user-dot"></div>',iconSize:[22,22],iconAnchor:[11,11]})}).addTo(map).bindPopup(`<b>Your location</b><br>Accuracy: ${Math.round(p.coords.accuracy)} m`).openPopup();map.setView(ll,14)},e=>alert('Unable to obtain your location: '+e.message),{enableHighAccuracy:true,maximumAge:30000,timeout:10000})};
start();
</script>
</body></html>
