<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fairfax Cross County Trail — Transit & Parking Map</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0}body{font-family:system-ui,-apple-system,Segoe UI,sans-serif}.panel{position:absolute;z-index:1000;background:#fff;box-shadow:0 2px 12px #0003;border-radius:8px}.title{top:12px;left:12px;padding:10px 14px;max-width:360px}.title h1{font-size:17px;margin:0 0 3px}.title p{font-size:12px;margin:0;color:#555}.legend{bottom:18px;left:12px;padding:10px 12px;max-width:320px;max-height:45vh;overflow:auto;font-size:12px}.controls{top:12px;right:12px;padding:8px}.legend-row{display:flex;align-items:center;gap:7px;margin:5px 0}.swatch{width:18px;height:18px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:11px;flex:none}.bus{border-radius:50%}.metro{transform:rotate(45deg);border-radius:2px}.metro span{transform:rotate(-45deg)}.popup h3{margin:0 0 5px;font-size:15px}.popup p{margin:3px 0}.popup a{color:#1769aa}.user-dot{width:16px;height:16px;border-radius:50%;background:#1464d2;border:3px solid white;box-shadow:0 0 0 2px #1464d2}button{border:1px solid #bbb;background:#fff;border-radius:5px;padding:7px 10px;cursor:pointer}</style></head><body><div id="map"></div><div class="panel title"><h1>Fairfax Cross County Trail</h1><p>Transit, parking & selected trail POIs</p></div><div class="panel controls"><button id="locate">⌖ Locate Me</button></div><div class="panel legend"><b>Legend</b><div id="legend-content">Loading…</div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const GPX_URL='https://raw.githubusercontent.com/squiddy-gh/cross-country-trail/main/data/FFX_CCT.gpx';
const DATA_URL='https://raw.githubusercontent.com/squiddy-gh/cross-country-trail/main/data/curated_pois_enriched.csv';
const TRANSIT_URL='https://raw.githubusercontent.com/squiddy-gh/cross-country-trail/main/data/transit.csv';
const routeColors={'305':'#7b2cbf','306':'#e76f51','310':'#2a9d8f','371':'#f4a261','395':'#264653','461':'#d62828','495':'#457b9d','574':'#6a994e','803':'#8338ec','951':'#ff9f1c'};
const metroColors={Blue:'#0072bc',Orange:'#f28c28',Silver:'#8b8f94'};
const map=L.map('map').setView([38.82,-77.25],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&quoted&&n==='"'){cell+='"';i++;continue}if(c==='"'){quoted=!quoted;continue}if(c===','&&!quoted){row.push(cell);cell='';continue}if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&n==='\n')i++;row.push(cell);cell='';if(row.some(x=>x!==''))rows.push(row);row=[];continue}cell+=c}if(cell!==''||row.length){row.push(cell);rows.push(row)}const h=rows.shift();return rows.map(r=>Object.fromEntries(h.map((x,i)=>[x,(r[i]??'').trim()])))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function busIcon(routes){const first=(routes||'').split(',')[0].trim(),color=routeColors[first]||'#555';return L.divIcon({className:'',html:`<div class="swatch bus" style="background:${color}">${esc(routes||'BUS')}</div>`,iconSize:[28,28],iconAnchor:[14,14]})}
function metroIcon(lines){const line=(lines||'').split(',')[0].trim(),color=metroColors[line]||'#555';return L.divIcon({className:'',html:`<div class="swatch metro" style="background:${color}"><span>M</span></div>`,iconSize:[30,30],iconAnchor:[15,15]})}
function parkingIcon(cap){const small=Number(cap)<=20;return L.divIcon({className:'',html:`<div class="swatch" style="background:${small?'#c62828':'#1565c0'};border-radius:5px">P</div>`,iconSize:[28,22],iconAnchor:[14,11]})}
function arrivalsURL(t){const route=(t.Routes||'').split(',')[0].trim();const stop=t.stop_code||t.stop_id||'';return `https://www.fairfaxcounty.gov/bustime/wireless/html/eta.jsp?route=${encodeURIComponent(route)}&direction=---&displaydirection=---&stop=${encodeURIComponent(stop)}&findstop=on&selectedRtpiFeeds=&id=${encodeURIComponent(stop)}`}
function transitPopup(t){const a=t.Agency||'';if(/Fairfax Connector/i.test(a))return `<div class="popup"><h3>${esc(t.stop_name)}</h3><p><b>Agency:</b> Fairfax Connector</p><p><b>Stop ID:</b> ${esc(t.stop_id||'')}</p>${t.stop_code?`<p><b>Stop code:</b> ${esc(t.stop_code)}</p>`:''}<p><b>Routes:</b> ${esc(t.Routes||'')}</p>${t.TrailMileage?`<p><b>CCT mile:</b> ${esc(t.TrailMileage)}</p>`:''}<p><a target="_blank" rel="noopener" href="${arrivalsURL(t)}">Live arrivals</a></p></div>`;return `<div class="popup"><h3>${esc(t.stop_name)}</h3><p><b>Agency:</b> ${esc(a)}</p>${t.stop_id?`<p><b>Stop ID:</b> ${esc(t.stop_id)}</p>`:''}${t.Routes?`<p><b>Routes/lines:</b> ${esc(t.Routes)}</p>`:''}${t.URL?`<p><a target="_blank" rel="noopener" href="${esc(t.URL)}">Service information</a></p>`:''}</div>`}
async function load(){const [gpxText,poiText,transitText]=await Promise.all([fetch(GPX_URL).then(r=>r.text()),fetch(DATA_URL).then(r=>r.text()),fetch(TRANSIT_URL).then(r=>r.text())]);const xml=new DOMParser().parseFromString(gpxText,'application/xml');const pts=[...xml.querySelectorAll('trkpt')].map(x=>[+x.getAttribute('lat'),+x.getAttribute('lon')]);const line=L.polyline(pts,{color:'#111',weight:4,opacity:.9}).addTo(map);map.fitBounds(line.getBounds(),{padding:[25,25]});const pois=parseCSV(poiText),transit=parseCSV(transitText);pois.filter(p=>p.Type==='Parking'&&p.Latitude&&p.Longitude).forEach(p=>L.marker([+p.Latitude,+p.Longitude],{icon:parkingIcon(p.Capacity)}).addTo(map).bindPopup(`<div class="popup"><h3>${esc(p.Name)}</h3><p><b>Spaces:</b> ${esc(p.Capacity||'')}</p>${p.Surface?`<p><b>Surface:</b> ${esc(p.Surface)}</p>`:''}${p.Hours?`<p><b>Hours:</b> ${esc(p.Hours)}</p>`:''}${p.Notes?`<p>${esc(p.Notes)}</p>`:''}${p.URL?`<p><a target="_blank" rel="noopener" href="${esc(p.URL)}">More information</a></p>`:''}</div>`));const routes=new Set();transit.filter(t=>t.Latitude&&t.Longitude).forEach(t=>{if(/Fairfax Connector/i.test(t.Agency||'')){(t.Routes||'').split(',').map(x=>x.trim()).filter(Boolean).forEach(r=>routes.add(r));L.marker([+t.Latitude,+t.Longitude],{icon:busIcon(t.Routes)}).addTo(map).bindPopup(transitPopup(t))}else L.marker([+t.Latitude,+t.Longitude],{icon:metroIcon(t.Routes)}).addTo(map).bindPopup(transitPopup(t))});let h='<div class="legend-row"><span class="swatch" style="background:#111">━</span>CCT</div><div class="legend-row"><span class="swatch" style="background:#c62828;border-radius:5px">P</span>Parking ≤20 spaces</div><div class="legend-row"><span class="swatch" style="background:#1565c0;border-radius:5px">P</span>Parking &gt;20 spaces</div>';[...routes].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).forEach(r=>h+=`<div class="legend-row"><span class="swatch bus" style="background:${routeColors[r]||'#555'}">${esc(r)}</span>Fairfax Connector ${esc(r)}</div>`);Object.entries(metroColors).forEach(([k,c])=>h+=`<div class="legend-row"><span class="swatch metro" style="background:${c}"><span>M</span></span>WMATA ${k} Line</div>`);h+='<hr><div><a target="_blank" href="https://www.wmata.com/schedules/trip-planner/">WMATA Trip Planner</a></div><div><a target="_blank" href="https://www.fairfaxcounty.gov/connector/">Fairfax Connector</a></div><div><a target="_blank" href="https://www.vre.org/">Virginia Railway Express</a></div>';document.getElementById('legend-content').innerHTML=h}
document.getElementById('locate').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{const ll=L.latLng(p.coords.latitude,p.coords.longitude);L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="user-dot"></div>',iconSize:[22,22],iconAnchor:[11,11]})}).addTo(map).bindPopup(`<b>Your location</b><br>Accuracy: ${Math.round(p.coords.accuracy)} m`).openPopup();map.setView(ll,14)},e=>alert('Unable to obtain your location: '+e.message),{enableHighAccuracy:true,maximumAge:30000,timeout:10000});load().catch(e=>{console.error(e);document.getElementById('legend-content').innerHTML='<b>Data load error</b><br>Serve this page from GitHub Pages or another web server.'});
</script></body></html>
