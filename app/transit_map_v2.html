<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CCT Transit Map</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0}body{font-family:system-ui,sans-serif}.panel{position:absolute;z-index:1000;background:white;box-shadow:0 2px 12px #0003;border-radius:8px}.title{top:12px;left:12px;padding:10px 14px}.legend{bottom:18px;left:12px;padding:10px 12px;max-height:50vh;overflow:auto;font-size:12px}.controls{top:12px;right:12px;padding:8px}.row{display:flex;align-items:center;gap:7px;margin:5px 0;cursor:pointer}.sw{width:20px;height:20px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:10px}.bus{border-radius:50%}.metro{transform:rotate(45deg)}.metro span{transform:rotate(-45deg)}.off{opacity:.35}.status{font-size:11px;color:#666;margin-top:6px}</style></head><body><div id="map"></div><div class="panel title"><b>Fairfax Cross County Trail</b><br><small>Transit & parking</small></div><div class="panel controls"><button id="locate">⌖ Locate Me</button></div><div class="panel legend"><b>Legend — click to toggle</b><div id="legend"></div><div id="status" class="status">Loading…</div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const base='https://raw.githubusercontent.com/squiddy-gh/cross-county-trail/main/data/';const urls={gpx:base+'trail/GC_CCT.gpx',pois:base+'curated_pois_enriched.csv',transit:base+'transit.csv'};const routes={'305':'#7b2cbf','306':'#e76f51','310':'#2a9d8f','371':'#f4a261','395':'#264653','461':'#d62828','495':'#457b9d','574':'#6a994e','803':'#8338ec','951':'#ff9f1c'},metro={Blue:'#0072bc',Orange:'#f28c28',Silver:'#8b8f94'};const map=L.map('map').setView([38.82,-77.25],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);const LYR={trail:L.layerGroup().addTo(map),parking:L.layerGroup().addTo(map),bus:L.layerGroup().addTo(map),metro:L.layerGroup().addTo(map),vre:L.layerGroup().addTo(map)};function csv(s){let a=[],r=[],c='',q=false;for(let i=0;i<s.length;i++){let x=s[i],n=s[i+1];if(x==='"'&&q&&n==='"'){c+='"';i++;continue}if(x==='"'){q=!q;continue}if(x===','&&!q){r.push(c);c='';continue}if((x==='\n'||x==='\r')&&!q){if(x==='\r'&&n==='\n')i++;r.push(c);c='';if(r.some(v=>v))a.push(r);r=[];continue}c+=x}if(c||r.length){r.push(c);a.push(r)}let h=a.shift();return a.map(z=>Object.fromEntries(h.map((k,i)=>[k,(z[i]||'').trim()]))) }function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function iconBus(r){let rs=(r||'').split(',').map(x=>x.trim()).filter(Boolean),c=routes[rs[0]]||'#555';return L.divIcon({className:'',html:`<span class="sw bus" style="background:${c}">${esc(rs.join('/'))}</span>`,iconSize:[32,32],iconAnchor:[16,16]})}function iconMetro(r){let x=(r||'').replace(/Metrorail|Line/ig,'').trim(),k=x.split(/[,/]/)[0].trim(),c=metro[k]||'#555';return L.divIcon({className:'',html:`<span class="sw metro" style="background:${c}"><span>M</span></span>`,iconSize:[30,30],iconAnchor:[15,15]})}async function get(u){let r=await fetch(u);if(!r.ok)throw Error(r.status);return r.text()}function pop(t){return `<h3>${esc(t.stop_name)}</h3><b>Agency:</b> ${esc(t.Agency)}<br><b>ID:</b> ${esc(t.stop_id||'')}<br><b>Routes:</b> ${esc(t.Routes||'')}${t.TrailMileage?`<br><b>CCT mile:</b> ${esc(t.TrailMileage)}`:''}${/Fairfax Connector/i.test(t.Agency||'')?`<br><br><a target="_blank" href="https://www.fairfaxcounty.gov/bustime/wireless/html/eta.jsp?route=${encodeURIComponent((t.Routes||'').split(',')[0].trim())}&direction=---&displaydirection=---&stop=${encodeURIComponent(t.stop_code||t.stop_id||'')}&findstop=on&selectedRtpiFeeds=&id=${encodeURIComponent(t.stop_code||t.stop_id||'')}">Live arrivals</a>`:'<br><br><a target="_blank" href="https://www.wmata.com/rider-guide/stations/">WMATA stations</a>'}`}async function main(){let status=[];try{let x=new DOMParser().parseFromString(await get(urls.gpx),'application/xml'),p=[...x.querySelectorAll('trkpt')].map(z=>[+z.getAttribute('lat'),+z.getAttribute('lon')]),l=L.polyline(p,{color:'#111',weight:4}).addTo(LYR.trail);map.fitBounds(l.getBounds(),{padding:[20,20]});status.push('trail')}catch(e){status.push('trail unavailable')}try{let a=csv(await get(urls.pois)),p=a.filter(x=>x.Type==='Parking'&&x.Latitude&&x.Longitude);p.forEach(x=>L.marker([+x.Latitude,+x.Longitude],{icon:L.divIcon({className:'',html:`<span class="sw" style="background:${Number(x.Capacity)<=20?'#c62828':'#1565c0'}">P</span>`,iconSize:[20,20]})}).addTo(LYR.parking).bindPopup(`<b>${esc(x.Name)}</b><br>Spaces: ${esc(x.Capacity||'')}<br>${esc(x.Surface||'')}<br>${esc(x.Hours||'')}`));status.push('parking '+p.length)}catch(e){status.push('parking unavailable')}try{let a=csv(await get(urls.transit)),b=0,m=0,v=0;a.filter(x=>x.Latitude&&x.Longitude).forEach(t=>{let k=(t.TransitID||'').toLowerCase();if(k==='bus'||/fairfax connector/i.test(t.Agency||'')){b++;L.marker([+t.Latitude,+t.Longitude],{icon:iconBus(t.Routes)}).addTo(LYR.bus).bindPopup(pop(t))}else if(k==='metro'||/wmata/i.test(t.Agency||'')){m++;L.marker([+t.Latitude,+t.Longitude],{icon:iconMetro(t.Routes)}).addTo(LYR.metro).bindPopup(pop(t))}else if(k==='rail'||/vre|virginia railway express/i.test(t.Agency||'')){v++;L.circleMarker([+t.Latitude,+t.Longitude],{radius:8}).addTo(LYR.vre).bindPopup(pop(t))}});status.push(`${b} bus, ${m} Metro, ${v} VRE`)}catch(e){status.push('transit unavailable')}document.getElementById('status').textContent=status.join(' • ')}function makeLegend(){let d=document.getElementById('legend'),h='';[['trail','━','CCT','#111'],['parking','P','Parking','#1565c0'],['bus','BUS','Fairfax Connector','#555'],['metro','M','Metrorail','#555'],['vre','VRE','VRE','#555']].forEach(x=>h+=`<div class="row" data-l="${x[0]}"><span class="sw" style="background:${x[3]}">${x[1]}</span>${x[2]}</div>`);Object.entries(routes).forEach(([r,c])=>h+=`<div class="row" data-l="bus"><span class="sw bus" style="background:${c}">${r}</span>Route ${r}</div>`);Object.entries(metro).forEach(([r,c])=>h+=`<div class="row" data-l="metro"><span class="sw metro" style="background:${c}"><span>M</span></span>${r} Line</div>`);h+='<hr><a target="_blank" href="https://www.wmata.com/schedules/trip-planner/">WMATA Trip Planner</a><br><a target="_blank" href="https://www.fairfaxcounty.gov/connector/">Fairfax Connector</a><br><a target="_blank" href="https://www.vre.org/">VRE</a>';d.innerHTML=h;d.querySelectorAll('.row').forEach(e=>e.onclick=()=>{let l=e.dataset.l;if(map.hasLayer(LYR[l])){map.removeLayer(LYR[l]);e.classList.add('off')}else{LYR[l].addTo(map);e.classList.remove('off')}})}makeLegend();main();document.getElementById('locate').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{let ll=[p.coords.latitude,p.coords.longitude];L.marker(ll).addTo(map).bindPopup('Your location').openPopup();map.setView(ll,14)});</script></body></html>
