<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fairfax Cross County Trail — Transit & Parking Map</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0}body{font-family:system-ui,-apple-system,Segoe UI,sans-serif}.panel{position:absolute;z-index:1000;background:#fff;box-shadow:0 2px 12px #0003;border-radius:8px}.title{top:12px;left:12px;padding:10px 14px;max-width:360px}.title h1{font-size:17px;margin:0 0 3px}.title p{font-size:12px;margin:0;color:#555}.legend{top:70px;right:12px;padding:10px 12px;max-width:330px;max-height:50vh;overflow:auto;font-size:12px}.controls{bottom:18px;left:12px;padding:8px}.legend-row{display:flex;align-items:center;gap:7px;margin:5px 0;cursor:pointer}.swatch{width:20px;height:20px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:10px;flex:none}.bus{border-radius:50%}.metro{transform:rotate(45deg);border-radius:2px}.metro span{transform:rotate(-45deg)}.popup h3{margin:0 0 5px;font-size:15px}.popup p{margin:3px 0}.popup a{color:#1769aa}.user-dot{width:16px;height:16px;border-radius:50%;background:#1464d2;border:3px solid white;box-shadow:0 0 0 2px #1464d2}.status{font-size:11px;color:#666;margin-top:7px}button{border:1px solid #bbb;background:#fff;border-radius:5px;padding:7px 10px;cursor:pointer}.layer-off{opacity:.35}.parking-legend{margin:7px 0}</style></head><body><div id="map"></div><div class="panel title"><h1>Fairfax Cross County Trail</h1><p>Transit, parking & selected trail POIs</p></div><div class="panel controls"><button id="locate">⌖ Locate Me</button></div><div class="panel legend"><b>Legend</b><div id="legend-content"></div><div id="status" class="status">Loading layers…</div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const base='https://raw.githubusercontent.com/squiddy-gh/cross-county-trail/main/data/';const GPX_URL=base+'trail/GC_CCT.gpx',DATA_URL=base+'curated_pois_enriched.csv',TRANSIT_URL=base+'transit.csv';const routeColors={'305':'#7b2cbf','306':'#e76f51','310':'#2a9d8f','371':'#f4a261','395':'#264653','461':'#d62828','495':'#457b9d','574':'#6a994e','803':'#8338ec','951':'#ff9f1c'},metroColors={Blue:'#0072bc',Orange:'#f28c28',Silver:'#8b8f94'};const map=L.map('map').setView([38.82,-77.25],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);const layers={trail:L.layerGroup().addTo(map),parking:L.layerGroup().addTo(map),bus:L.layerGroup().addTo(map),metro:L.layerGroup().addTo(map),vre:L.layerGroup().addTo(map)};
function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&quoted&&n==='"'){cell+='"';i++;continue}if(c==='"'){quoted=!quoted;continue}if(c===','&&!quoted){row.push(cell);cell='';continue}if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&n==='\n')i++;row.push(cell);cell='';if(row.some(x=>x!==''))rows.push(row);row=[];continue}cell+=c}if(cell!==''||row.length){row.push(cell);rows.push(row)}const h=rows.shift();return rows.map(r=>Object.fromEntries(h.map((x,i)=>[x,(r[i]??'').trim()])))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function busIcon(routes){const rs=(routes||'').split(',').map(x=>x.trim()).filter(Boolean);const first=rs[0]||'BUS';const color=routeColors[first]||'#555';return L.divIcon({className:'',html:`<div class="swatch bus" style="background:${color}">${esc(rs.join('/'))}</div>`,iconSize:[38,38],iconAnchor:[19,19]})}function metroIcon(lines){let line=(lines||'').replace(/Metrorail/ig,'').replace(/Line/ig,'').trim().split(/[,/]/)[0].trim();line=line.charAt(0).toUpperCase()+line.slice(1);const color=metroColors[line]||'#555';return L.divIcon({className:'',html:`<div class="swatch metro" style="background:${color}"><span>M</span></div>`,iconSize:[30,30],iconAnchor:[15,15]})}function parkingIcon(cap){return L.divIcon({className:'',html:`<div class="swatch" style="background:${Number(cap)<=20?'#c62828':'#1565c0'};border-radius:5px;font-size:15px">P</div>`,iconSize:[28,22],iconAnchor:[14,11]})}function transitLink(t){return t['Live Link']||t.LiveLink||t.live_link||t.Live_URL||t.URL||''}function arrivalsURL(t){const route=(t.Routes||'').split(',')[0].trim(),stop=t.stop_code||t.stop_id||'';return `https://www.fairfaxcounty.gov/bustime/wireless/html/eta.jsp?route=${encodeURIComponent(route)}&direction=---&displaydirection=---&stop=${encodeURIComponent(stop)}&findstop=on&selectedRtpiFeeds=&id=${encodeURIComponent(stop)}`}function transitPopup(t){const a=t.Agency||'',link=transitLink(t);let service='';if(/Fairfax Connector/i.test(a))service=`<p><a target="_blank" rel="noopener" href="${arrivalsURL(t)}">Live arrivals</a></p>`;else if(link)service=`<p><a target="_blank" rel="noopener" href="${esc(link)}">Station / service information</a></p>`;return `<div class="popup"><h3>${esc(t.stop_name)}</h3><p><b>Agency:</b> ${esc(a)}</p>${t.stop_id?`<p><b>Stop ID:</b> ${esc(t.stop_id)}</p>`:''}${t.Routes?`<p><b>Routes / lines:</b> ${esc(t.Routes)}</p>`:''}${t.TrailMileage?`<p><b>CCT mile:</b> ${esc(t.TrailMileage)}</p>`:''}${service}</div>`}function poiPopup(p){return `<div class="popup"><h3>${esc(p.Name)}</h3><p><b>Type:</b> ${esc(p.Type)}</p>${p.Capacity?`<p><b>Spaces:</b> ${esc(p.Capacity)}</p>`:''}${p.Surface?`<p><b>Surface:</b> ${esc(p.Surface)}</p>`:''}${p.Hours?`<p><b>Hours:</b> ${esc(p.Hours)}</p>`:''}${p.Notes?`<p>${esc(p.Notes)}</p>`:''}</div>`}async function loadText(url){const r=await fetch(url);if(!r.ok)throw Error(`${r.status} ${r.statusText}`);return r.text()}async function loadTrail(){try{const xml=new DOMParser().parseFromString(await loadText(GPX_URL),'application/xml'),pts=[...xml.querySelectorAll('trkpt')].map(x=>[+x.getAttribute('lat'),+x.getAttribute('lon')]);if(!pts.length)throw Error('No track points');const line=L.polyline(pts,{color:'#111',weight:4,opacity:.9}).addTo(layers.trail);map.fitBounds(line.getBounds(),{padding:[25,25]});return'trail'}catch(e){console.error(e);return'trail unavailable'}}async function loadPOI(){try{const pois=parseCSV(await loadText(DATA_URL)),p=pois.filter(x=>x.Type==='Parking'&&x.Latitude&&x.Longitude);p.forEach(x=>L.marker([+x.Latitude,+x.Longitude],{icon:parkingIcon(x.Capacity)}).addTo(layers.parking).bindPopup(poiPopup(x)));return`parking (${p.length})`}catch(e){console.error(e);return'parking unavailable'}}async function loadTransit(){try{const rows=parseCSV(await loadText(TRANSIT_URL));let b=0,m=0,v=0;rows.filter(t=>t.Latitude&&t.Longitude).forEach(t=>{const k=(t.TransitID||'').toLowerCase();if(k==='bus'||/fairfax connector/i.test(t.Agency||'')){b++;L.marker([+t.Latitude,+t.Longitude],{icon:busIcon(t.Routes)}).addTo(layers.bus).bindPopup(transitPopup(t))}else if(k==='metro'||/wmata/i.test(t.Agency||'')){m++;L.marker([+t.Latitude,+t.Longitude],{icon:metroIcon(t.Routes)}).addTo(layers.metro).bindPopup(transitPopup(t))}else if(k==='rail'||/vre|virginia railway express/i.test(t.Agency||'')){v++;L.circleMarker([+t.Latitude,+t.Longitude],{radius:8,weight:2}).addTo(layers.vre).bindPopup(transitPopup(t))}});return`${b} bus, ${m} Metro, ${v} VRE`}catch(e){console.error(e);return'transit unavailable'}}function legend(){const c=document.getElementById('legend-content');let h='<div class="legend-row" data-layer="trail"><span class="swatch" style="background:#111">━</span>Cross-County Trail</div><div class="parking-legend"><div class="legend-row" data-layer="parking"><span class="swatch" style="background:#1565c0">P</span>Parking — standard</div><div class="legend-row"><span class="swatch" style="background:#c62828">P</span>Parking — limited space (≤20)</div></div><div class="legend-row" data-layer="bus"><span class="swatch bus" style="background:#555">BUS</span>Fairfax Connector</div><div class="legend-row" data-layer="metro"><span class="swatch metro" style="background:#555"><span>M</span></span>Metrorail</div><div class="legend-row" data-layer="vre"><span class="swatch" style="background:#555">VRE</span>Virginia Railway Express</div><hr>';Object.entries(routeColors).forEach(([r,col])=>h+=`<div class="legend-row" data-layer="bus"><span class="swatch bus" style="background:${col}">${r}</span>Route ${r}</div>`);Object.entries(metroColors).forEach(([r,col])=>h+=`<div class="legend-row" data-layer="metro"><span class="swatch metro" style="background:${col}"><span>M</span></span>${r} Line</div>`);h+='<hr><div><a target="_blank" href="https://www.wmata.com/schedules/trip-planner/">WMATA Trip Planner</a></div><div><a target="_blank" href="https://www.fairfaxcounty.gov/connector/">Fairfax Connector</a></div><div><a target="_blank" href="https://www.vre.org/">Virginia Railway Express</a></div>';c.innerHTML=h;c.querySelectorAll('[data-layer]').forEach(el=>el.onclick=()=>{const id=el.dataset.layer;if(map.hasLayer(layers[id])){map.removeLayer(layers[id]);el.classList.add('layer-off')}else{layers[id].addTo(map);el.classList.remove('layer-off')}})}async function main(){legend();const r=await Promise.all([loadTrail(),loadPOI(),loadTransit()]);document.getElementById('status').textContent=r.join(' • ')}document.getElementById('locate').onclick=()=>{if(!navigator.geolocation)return alert('Geolocation is not available.');navigator.geolocation.getCurrentPosition(p=>{const ll=L.latLng(p.coords.latitude,p.coords.longitude);L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="user-dot"></div>',iconSize:[22,22],iconAnchor:[11,11]})}).addTo(map).bindPopup(`<b>Your location</b><br>Accuracy: ${Math.round(p.coords.accuracy)} m`).openPopup();map.setView(ll,14)},e=>alert('Unable to obtain your location: '+e.message),{enableHighAccuracy:true,maximumAge:30000,timeout:10000})};main();</script></body></html>
