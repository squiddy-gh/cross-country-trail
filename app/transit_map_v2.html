<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fairfax Cross County Trail — Transit & Parking</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0}body{font-family:system-ui,-apple-system,Segoe UI,sans-serif}.panel{position:absolute;z-index:1000;background:#fff;box-shadow:0 2px 12px #0003;border-radius:8px}.title{top:12px;left:12px;padding:10px 14px}.title b{font-size:17px}.title small{color:#555}.legend{top:12px;right:12px;left:auto;bottom:auto;padding:11px 13px;width:250px;max-height:calc(100vh - 48px);overflow:auto;font-size:12px}.controls{bottom:18px;right:12px;padding:8px}.row{display:flex;align-items:center;gap:8px;margin:6px 0;cursor:pointer;user-select:none}.row:hover{text-decoration:underline}.off{opacity:.35}.sw{width:22px;height:22px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:11px;flex:none}.bus{border-radius:50%}.multi-bus{display:flex;align-items:stretch;height:24px;border-radius:12px;overflow:hidden;color:#fff;font-weight:700;font-size:10px;box-shadow:0 1px 3px #0004}.multi-bus span{display:flex;align-items:center;justify-content:center;padding:0 5px;min-width:21px;border-right:1px solid #fff8}.multi-bus span:last-child{border-right:0}.metro{transform:rotate(45deg);border-radius:2px}.metro span{transform:rotate(-45deg)}.parking-small{background:#c62828}.parking-large{background:#1565c0}.status{font-size:11px;color:#666;margin-top:8px}.popup h3{margin:0 0 6px;font-size:15px}.popup p{margin:3px 0}.popup a{color:#1769aa}.section-label{font-weight:700;margin:9px 0 4px}.links a{display:block;margin:4px 0}button{border:1px solid #aaa;background:#fff;border-radius:5px;padding:7px 10px;cursor:pointer}.user-dot{width:16px;height:16px;border-radius:50%;background:#1464d2;border:3px solid #fff;box-shadow:0 0 0 2px #1464d2}</style></head><body><div id="map"></div><div class="panel title"><b>Fairfax Cross County Trail</b><br><small>Transit & parking map</small></div><div class="panel legend"><b>Legend — click to toggle</b><div id="legend"></div><div id="status" class="status">Loading…</div></div><div class="panel controls"><button id="locate">⌖ Locate Me</button></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const base='https://raw.githubusercontent.com/squiddy-gh/cross-county-trail/main/data/';const urls={gpx:base+'trail/GC_CCT.gpx',pois:base+'curated_pois_enriched.csv',transit:base+'transit.csv'};const routes={'305':'#7b2cbf','306':'#e76f51','310':'#2a9d8f','371':'#f4a261','395':'#264653','461':'#d62828','495':'#457b9d','574':'#6a994e','803':'#8338ec','951':'#ff9f1c'},metro={Blue:'#0072bc',Orange:'#f28c28',Silver:'#8b8f94'};const map=L.map('map').setView([38.82,-77.25],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);const LYR={trail:L.layerGroup().addTo(map),parking:L.layerGroup().addTo(map),bus:L.layerGroup().addTo(map),metro:L.layerGroup().addTo(map),vre:L.layerGroup().addTo(map)};
function csv(s){let a=[],r=[],c='',q=false;for(let i=0;i<s.length;i++){let x=s[i],n=s[i+1];if(x==='"'&&q&&n==='"'){c+='"';i++;continue}if(x==='"'){q=!q;continue}if(x===','&&!q){r.push(c);c='';continue}if((x==='\n'||x==='\r')&&!q){if(x==='\r'&&n==='\n')i++;r.push(c);c='';if(r.some(v=>v))a.push(r);r=[];continue}c+=x}if(c||r.length){r.push(c);a.push(r)}let h=a.shift();return a.map(z=>Object.fromEntries(h.map((k,i)=>[k,(z[i]||'').trim()]))) }
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function getField(o,names){for(const n of names)if(o[n])return o[n];return ''}
function iconBus(r){const rs=(r||'').split(',').map(x=>x.trim()).filter(Boolean);if(rs.length<=1){const x=rs[0]||'BUS';return L.divIcon({className:'',html:`<span class="sw bus" style="background:${routes[x]||'#555'}">${esc(x)}</span>`,iconSize:[28,28],iconAnchor:[14,14]})}const shown=rs.slice(0,3);return L.divIcon({className:'',html:`<span class="multi-bus">${shown.map(x=>`<span style="background:${routes[x]||'#555'}">${esc(x)}</span>`).join('')}</span>`,iconSize:[Math.max(48,shown.length*30),24],iconAnchor:[Math.max(24,shown.length*15),12]})}
function iconMetro(r){let x=(r||'').replace(/Metrorail|Line/ig,'').trim(),k=x.split(/[,/]/)[0].trim();k=k.charAt(0).toUpperCase()+k.slice(1);return L.divIcon({className:'',html:`<span class="sw metro" style="background:${metro[k]||'#555'}"><span>M</span></span>`,iconSize:[30,30],iconAnchor:[15,15]})}
function iconParking(cap){const small=Number(cap)<=20;return L.divIcon({className:'',html:`<span class="sw ${small?'parking-small':'parking-large'}" style="font-size:15px">P</span>`,iconSize:[24,24],iconAnchor:[12,12]})}
async function get(u){const r=await fetch(u);if(!r.ok)throw Error(r.status+' '+r.statusText);return r.text()}
function transitPopup(t){const agency=t.Agency||'',live=getField(t,['Live Link','LiveLink','live_link','Live_URL','URL']);let body=`<div class="popup"><h3>${esc(t.stop_name)}</h3><p><b>Agency:</b> ${esc(agency)}</p>${t.stop_id?`<p><b>Stop ID:</b> ${esc(t.stop_id)}</p>`:''}${t.stop_code?`<p><b>Stop code:</b> ${esc(t.stop_code)}</p>`:''}${t.Routes?`<p><b>Routes / lines:</b> ${esc(t.Routes)}</p>`:''}${t.TrailMileage?`<p><b>CCT mile:</b> ${esc(t.TrailMileage)}</p>`:''}`;if(/Fairfax Connector/i.test(agency)){if(live)body+=`<p><a target="_blank" rel="noopener" href="${esc(live)}">Live arrivals</a></p>`}else if(live)body+=`<p><a target="_blank" rel="noopener" href="${esc(live)}">Station / live service information</a></p>`;body+='</div>';return body}
function poiPopup(p){return `<div class="popup"><h3>${esc(p.Name)}</h3><p><b>Type:</b> Parking</p>${p.Capacity?`<p><b>Spaces:</b> ${esc(p.Capacity)}</p>`:''}${p.Surface?`<p><b>Surface:</b> ${esc(p.Surface)}</p>`:''}${p.Hours?`<p><b>Hours:</b> ${esc(p.Hours)}</p>`:''}${p['Trail Mileage']?`<p><b>CCT mile:</b> ${esc(p['Trail Mileage'])}</p>`:''}${p.Notes?`<p>${esc(p.Notes)}</p>`:''}${p.URL?`<p><a target="_blank" rel="noopener" href="${esc(p.URL)}">More information</a></p>`:''}</div>`}
async function main(){let status=[];try{let x=new DOMParser().parseFromString(await get(urls.gpx),'application/xml'),p=[...x.querySelectorAll('trkpt')].map(z=>[+z.getAttribute('lat'),+z.getAttribute('lon')]),l=L.polyline(p,{color:'#111',weight:4}).addTo(LYR.trail);map.fitBounds(l.getBounds(),{padding:[20,20]});status.push('trail')}catch(e){console.error(e);status.push('trail unavailable')}try{let a=csv(await get(urls.pois)),p=a.filter(x=>x.Type==='Parking'&&x.Latitude&&x.Longitude);p.forEach(x=>L.marker([+x.Latitude,+x.Longitude],{icon:iconParking(x.Capacity)}).addTo(LYR.parking).bindPopup(poiPopup(x)));status.push('parking '+p.length)}catch(e){console.error(e);status.push('parking unavailable')}try{let a=csv(await get(urls.transit)),b=0,m=0,v=0;a.filter(x=>x.Latitude&&x.Longitude).forEach(t=>{let k=(t.TransitID||'').toLowerCase();if(k==='bus'||/fairfax connector/i.test(t.Agency||'')){b++;L.marker([+t.Latitude,+t.Longitude],{icon:iconBus(t.Routes)}).addTo(LYR.bus).bindPopup(transitPopup(t))}else if(k==='metro'||/wmata/i.test(t.Agency||'')){m++;L.marker([+t.Latitude,+t.Longitude],{icon:iconMetro(t.Routes)}).addTo(LYR.metro).bindPopup(transitPopup(t))}else if(k==='rail'||/vre|virginia railway express/i.test(t.Agency||'')){v++;L.circleMarker([+t.Latitude,+t.Longitude],{radius:8,weight:2}).addTo(LYR.vre).bindPopup(transitPopup(t))}});status.push(`${b} bus, ${m} Metro, ${v} VRE`)}catch(e){console.error(e);status.push('transit unavailable')}document.getElementById('status').textContent=status.join(' • ')}
function makeLegend(){let d=document.getElementById('legend'),h='';h+=`<div class="section-label">Map</div><div class="row" data-l="trail"><span class="sw" style="background:#111">━</span>CCT</div>`;h+=`<div class="section-label">Parking</div><div class="row" data-l="parking"><span class="sw parking-small">P</span>Limited space (≤20)</div><div class="row" data-l="parking"><span class="sw parking-large">P</span>Large parking area (&gt;20)</div>`;h+=`<div class="section-label">Transit</div><div class="row" data-l="bus"><span class="sw bus" style="background:#555">BUS</span>Fairfax Connector</div>`;Object.entries(routes).forEach(([r,c])=>h+=`<div class="row" data-l="bus"><span class="sw bus" style="background:${c}">${r}</span>Route ${r}</div>`);h+=`<div class="row" data-l="metro"><span class="sw metro" style="background:#555"><span>M</span></span>Metrorail</div>`;Object.entries(metro).forEach(([r,c])=>h+=`<div class="row" data-l="metro"><span class="sw metro" style="background:${c}"><span>M</span></span>${r} Line</div>`);h+=`<div class="row" data-l="vre"><span class="sw" style="background:#555">VRE</span>Virginia Railway Express</div><div class="section-label">Trip planners</div><div class="links"><a target="_blank" rel="noopener" href="https://www.wmata.com/schedules/trip-planner/">WMATA Trip Planner</a><a target="_blank" rel="noopener" href="https://www.fairfaxcounty.gov/connector/">Fairfax Connector</a><a target="_blank" rel="noopener" href="https://www.vre.org/">VRE</a></div>`;d.innerHTML=h;d.querySelectorAll('.row').forEach(e=>e.onclick=()=>{let l=e.dataset.l;if(map.hasLayer(LYR[l])){map.removeLayer(LYR[l]);e.classList.add('off')}else{LYR[l].addTo(map);e.classList.remove('off')}})}
makeLegend();main();document.getElementById('locate').onclick=()=>{if(!navigator.geolocation)return alert('Geolocation is not available.');navigator.geolocation.getCurrentPosition(p=>{let ll=[p.coords.latitude,p.coords.longitude];L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="user-dot"></div>',iconSize:[22,22],iconAnchor:[11,11]})}).addTo(map).bindPopup(`<b>Your location</b><br>Accuracy: ${Math.round(p.coords.accuracy)} m`).openPopup();map.setView(ll,14)},e=>alert('Unable to obtain your location: '+e.message),{enableHighAccuracy:true,maximumAge:30000,timeout:10000})};</script></body></html>
