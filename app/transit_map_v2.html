<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fairfax Cross County Trail — Transit & Parking Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="./assets/cct-map-theme.css">
</head>
<body>
  <div id="map"></div>
  <div class="cct-panel cct-title"><h1>Fairfax Cross County Trail</h1><p>Transit, parking & selected trail POIs</p></div>
  <div class="cct-panel cct-controls"><button id="locate">⌖ Locate Me</button></div>
  <div class="cct-panel cct-legend"><b>Legend</b><div id="legend-content"></div><div id="status" class="cct-status">Loading layers…</div></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./assets/cct-map-config.js"></script>
  <script src="./assets/cct-map-icons.js"></script>
  <script src="./assets/cct-map-core.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => CCTMap.init({
      mapElement: 'map', legendElement: 'legend-content', statusElement: 'status', locateButton: 'locate'
    }));
  </script>
</body>
</html>
