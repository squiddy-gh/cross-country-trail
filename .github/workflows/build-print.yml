name: Build printable CCT guide

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/**'
      - 'scripts/build_print.py'
      - '.github/workflows/build-print.yml'

permissions:
  contents: read

jobs:
  build-print:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install reportlab
      - run: python scripts/build_print.py
      - uses: actions/upload-artifact@v4
        with:
          name: fairfax-cross-county-trail-print-pdfs
          path: print/output/*.pdf
